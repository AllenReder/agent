providers:
  allenpi:
    baseUrl: https://api.example.top/v1
    apiKey: ALLENPI_API_KEY
    authHeader: true
    api: openai-completions
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash
        input: [text, image]
        supportsTools: true
        reasoning: true
        contextWindow: 1000000
        maxTokens: 256000
        thinking:
          mode: effort
          efforts: [low, high, xhigh, max]
          defaultLevel: high
          requiresEffort: false
          effortMap:
            low: low
            high: high
            xhigh: xhigh
            max: max

