providers:
  allenpi:
    baseUrl: https://api.example.top/v1
    apiKey: ALLENPI_API_KEY
    authHeader: true
    api: openai-completions
    models:
      - id: MiniMax-M3
        name: MiniMax M3
        input: [text, image]
        supportsTools: true
        reasoning: true
        contextWindow: 1000000
        maxTokens: 128000
        thinking:
          mode: effort
          efforts: [low, medium, high]
          defaultLevel: high
          requiresEffort: false

      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        input: [text]
        supportsTools: true
        reasoning: true
        contextWindow: 1000000
        maxTokens: 384000
        thinking:
          mode: effort
          efforts: [low, high, xhigh, max]
          defaultLevel: high
          requiresEffort: false
          effortMap:
            low: low
            high: high
            xhigh: xhigh
            max: max

